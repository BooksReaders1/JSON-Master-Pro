<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📋 JSON Master Pro</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📋</text></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'JetBrains Mono', 'Consolas', monospace; }
        .editor-box {
            @apply w-full bg-gray-800 border border-gray-600 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-blue-500 resize-none;
        }
        .btn-primary {
            @apply bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg transition-colors flex items-center gap-2;
        }
        .btn-secondary {
            @apply bg-gray-600 hover:bg-gray-700 text-white px-4 py-2 rounded-lg transition-colors flex items-center gap-2;
        }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { @apply bg-gray-800; }
        ::-webkit-scrollbar-thumb { @apply bg-gray-600 rounded; }
        ::-webkit-scrollbar-thumb:hover { @apply bg-gray-500; }
    </style>
</head>
<body class="bg-gray-900 min-h-screen flex flex-col">
    <!-- 顶部标题 -->
    <header class="bg-gray-800 border-b border-gray-700 px-6 py-4">
        <h1 class="text-2xl font-bold text-white flex items-center gap-3">
            <i class="fas fa-code text-blue-400"></i>
            JSON Master Pro
        </h1>
    </header>

    <!-- 主内容区 -->
    <main class="flex-1 flex flex-col p-6 gap-6 min-h-0">
        <!-- 全局输入框 -->
        <div class="flex flex-col gap-2">
            <label class="text-sm font-medium text-gray-400">全局 JSON 输入 (所有模块同步)</label>
            <textarea id="global-json-input" class="editor-box h-32" placeholder="在此粘贴或输入 JSON 数据..."></textarea>
        </div>

        <!-- Tab 导航容器 (动态生成) -->
        <div id="tabs-container" class="flex gap-2 border-b border-gray-700 overflow-x-auto"></div>

        <!-- 模块内容容器 (动态生成) -->
        <div id="modules-container" class="flex-1 flex flex-col min-h-0"></div>
    </main>

    <!-- 核心框架 -->
    <script src="js/core/toast.js"></script>
    <script src="js/core/utils.js"></script>
    <script src="js/core/app.js"></script>

    <!-- 功能模块 (按需添加，自动注册) -->
    <script src="js/modules/format.js"></script>
    <script src="js/modules/tree.js"></script>
    <script src="js/modules/compare.js"></script>
    <script src="js/modules/convert.js"></script>
    <script src="js/modules/java.js"></script>
    <script src="js/modules/bean.js"></script>
    <script src="js/modules/mock.js"></script>
    <script src="js/modules/query.js"></script>
    <script src="js/modules/analyze.js"></script>

    <!-- 外部库 (Mock 和查询功能需要) -->
    <script src="https://cdn.jsdelivr.net/npm/@faker-js/faker@8/dist/faker.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsonpath-plus@7.2.0/dist/index-browser-min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jmespath@0.16.0/jmespath.min.js"></script>
</body>
</html>
