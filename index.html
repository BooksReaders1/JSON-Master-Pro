<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSON Master Pro</title>
    <link rel="icon" href="image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📋</text></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/@fontsource/jetbrains-mono@5.0.18/index.min.css" rel="stylesheet">
    
    <style>
        body { font-family: 'JetBrains Mono', monospace; background-color: #0f172a; color: #e2e8f0; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #1e293b; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #64748b; }

        .json-key { color: #93c5fd; }
        .json-string { color: #86efac; }
        .json-number { color: #fca5a5; }
        .json-boolean { color: #d8b4fe; }
        .json-null { color: #cbd5e1; font-style: italic; }

        .json-tree ul { list-style: none; margin: 0; padding-left: 18px; }
        .json-tree > ul { padding-left: 0; }
        .json-tree li { position: relative; }
        .j-row { white-space: pre; line-height: 1.7; }
        .j-row:hover { background-color: rgba(255,255,255,0.04); }
        .j-toggle { display: inline-block; width: 16px; text-align: center; cursor: pointer; color: #64748b; font-size: 10px; user-select: none; }
        .j-toggle:hover { color: #93c5fd; }
        .j-toggle-off { visibility: hidden; pointer-events: none; }
        .j-sp { display: inline-block; width: 16px; }
        .j-br { color: #cbd5e1; }
        .j-ell { display: none; color: #64748b; font-style: italic; cursor: pointer; }
        .j-ell:hover { color: #93c5fd; }
        .j-close { white-space: pre; color: #cbd5e1; line-height: 1.7; }
        li.j-node.collapsed > ul.j-children { display: none; }
        li.j-node.collapsed > div.j-close { display: none; }
        li.j-node.collapsed > .j-row .j-ell { display: inline; }
        li.j-node.collapsed > .j-row .j-toggle i { transform: rotate(-90deg); }

        .editor-box { width: 100%; height: 100%; background: #0b1220; color: #e2e8f0; border: 1px solid #334155; border-radius: 0.5rem; padding: 1rem; font-family: inherit; font-size: 0.875rem; line-height: 1.75rem; resize: none; outline: none; }
        .editor-box:focus { border-color: #3b82f6; }
        
        .diff-layer { position: absolute; inset: 0; overflow: auto; background: #0b1220; border-radius: 0.5rem; }
        .diff-inner { min-width: 100%; width: max-content; padding: 10px 0 40vh 0; }
        .diff-row { display: flex; min-height: 22px; line-height: 22px; font-size: 12px; }
        .diff-row:hover { background-color: rgba(255,255,255,0.04); }
        .ln { width: 46px; text-align: right; padding-right: 8px; color: #475569; user-select: none; flex-shrink: 0; border-right: 1px solid rgba(255,255,255,0.06); margin-right: 10px; font-size: 10px; }
        .dg { width: 16px; text-align: center; font-weight: bold; user-select: none; flex-shrink: 0; opacity: 0.9; }
        .dc { white-space: pre; padding-right: 20px; flex: 1; }
        .bg-added { background-color: rgba(34, 197, 94, 0.14); }
        .bg-removed { background-color: rgba(239, 68, 68, 0.14); }
        .bg-modified { background-color: rgba(234, 179, 8, 0.12); }
        .text-added { color: #4ade80; }
        .text-removed { color: #f87171; }
        .text-modified { color: #facc15; }
        .word-diff-l { background: rgba(239,68,68,0.45); border-radius: 2px; color: #fff; }
        .word-diff-r { background: rgba(34,197,94,0.45); border-radius: 2px; color: #fff; }
        @keyframes flash { 0% { background-color: rgba(255,255,255,0.45); } 100% { background-color: transparent; } }
        .diff-active { animation: flash 1.2s ease-out; outline: 1px solid #3b82f6; outline-offset: -1px; position: relative; z-index: 5; }

        mark { background-color: #facc15; color: #000; border-radius: 2px; padding: 0 2px; }
        mark.current { background-color: #f97316; color: #fff; box-shadow: 0 0 0 2px #f97316; }
        
        .toast-container { position: fixed; top: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 10px; }
        .toast { min-width: 250px; padding: 12px 16px; border-radius: 6px; color: white; font-size: 14px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); transform: translateX(100%); transition: transform 0.3s ease; display: flex; align-items: center; gap: 8px; }
        .toast.show { transform: translateX(0); }
        .toast-info { background-color: #3b82f6; }
        .toast-success { background-color: #10b981; }
        .toast-warning { background-color: #f59e0b; }
        .toast-error { background-color: #ef4444; }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden">
    <div id="toastContainer" class="toast-container"></div>

    <header class="flex items-center justify-between px-6 py-3 bg-slate-900 border-b border-slate-700 shadow-md z-20">
        <div class="flex items-center gap-3">
            <i class="fa-solid fa-layer-group text-blue-500 text-2xl"></i>
            <h1 class="text-xl font-bold tracking-wide text-white">JSON <span class="text-blue-500">Master Pro</span></h1>
        </div>
        <div class="flex gap-2">
            <button onclick="App.clearAll()" class="px-3 py-1.5 text-sm text-slate-300 hover:text-white transition"><i class="fa-solid fa-trash-can mr-2"></i>清空</button>
            <button onclick="App.copyCurrentOutput()" class="px-3 py-1.5 text-sm bg-blue-600 hover:bg-blue-700 text-white rounded transition shadow-lg shadow-blue-500/20"><i class="fa-solid fa-copy mr-2"></i>复制</button>
        </div>
    </header>

    <main class="flex-1 flex flex-col overflow-hidden relative">
        <div id="tabsContainer" class="flex border-b border-slate-700 bg-slate-900 px-6 overflow-x-auto"></div>
        <div id="modulesContainer" class="flex-1 flex overflow-hidden"></div>
    </main>

    <script src="js/core/toast.js"></script>
    <script src="js/core/utils.js"></script>
    <script src="js/core/app.js"></script>
    <script src="js/modules/format.js"></script>
    <script src="js/modules/tree.js"></script>
    <script src="js/modules/compare.js"></script>
    <script src="js/modules/convert.js"></script>
    <script src="js/modules/java.js"></script>
    <script src="js/modules/bean.js"></script>
    <script src="js/modules/mock.js"></script>
    <script src="js/modules/query.js"></script>
    <script src="js/modules/analyze.js"></script>
</body>
</html>
